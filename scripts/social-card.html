<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: Arvo; src: url("../assets/fonts/arvo-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: Bai; src: url("../assets/fonts/bai-jamjuree-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #F6F7F3; color: #182327; font-family: Bai, Arial, sans-serif; }
    .card { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; padding: 72px 88px; overflow: hidden; }
    .card::before { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; top: -190px; left: 420px; background: #0AD69C; opacity: .22; }
    .card::after { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -70px; bottom: -70px; background: #FF5A5F; opacity: .88; }
    .copy { position: relative; z-index: 2; }
    .brand { margin-bottom: 66px; font-family: Arvo, Georgia, serif; font-size: 34px; color: #1D4497; }
    .eyebrow { margin-bottom: 18px; color: #176B82; font-size: 17px; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Arvo, Georgia, serif; font-size: 77px; line-height: .98; letter-spacing: -.045em; }
    p { margin: 23px 0 0; max-width: 520px; color: #5F635A; font-size: 23px; line-height: 1.45; }
    .visual { position: relative; z-index: 1; height: 430px; display: grid; place-items: center; border: 1px solid #C9D0CB; border-radius: 34px; background: #F2F1DF; transform: rotate(-2deg); box-shadow: 0 28px 68px rgba(24,35,39,.14); }
    .visual img { width: 92%; transform: rotate(2deg); }
    .beats { position: absolute; left: 88px; bottom: 38px; display: flex; gap: 9px; }
    .beats i { width: 42px; height: 8px; border-radius: 9px; }
    .beats i:nth-child(1) { background: #FF5A5F; }
    .beats i:nth-child(2) { background: #FFBC1F; }
    .beats i:nth-child(3) { background: #0AD69C; }
    .beats i:nth-child(4) { background: #59D2FE; }
  </style>
</head>
<body>
  <main class="card">
    <div class="copy">
      <div class="brand">Landometer</div>
      <div class="eyebrow">Manual + AI-ready</div>
      <h1>Motif<br>Library</h1>
      <p>Purposeful motion. Exact assets. Clear product boundaries.</p>
    </div>
    <div class="visual"><img src="../assets/landometer/svg/dial-full.svg" alt=""></div>
    <div class="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </main>
</body>
</html>
